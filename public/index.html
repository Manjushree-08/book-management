
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Online Book Management System</h1>
        <p>Manage your books easily</p>
    </header>

    <main>
        <section class="form-section">
            <h2 id="formTitle">Add New Book</h2>

            <form id="bookForm">
                <input type="hidden" id="bookId">

                <input type="text" id="title"
                    placeholder="Book Title" required>

                <input type="text" id="author"
                    placeholder="Author Name" required>

                <input type="number" id="price"
                    placeholder="Book Price" min="0.01"
                    step="0.01" required>

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button type="button" id="cancelBtn"
                    class="cancel-btn" hidden>
                    Cancel
                </button>
            </form>

            <p id="message"></p>
        </section>

        <section class="books-section">
            <h2>Available Books</h2>

            <div class="search-box">
                <input type="number" id="searchId"
                    placeholder="Enter Book ID">
                <button type="button" id="searchBtn">
                    Search
                </button>
                <button type="button" id="showAllBtn">
                    Show All
                </button>
            </div>

            <div id="bookList"></div>
        </section>
    </main>

    <footer>
        <p>Online Book Management System | Node.js & Express.js</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
